[project]
name = "mirofish-backend"
version = "0.1.0"
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.13.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",

    # Direct pin so [tool.uv.sources] below forces the CPU-only wheel onto
    # the transitive torch requirement pulled in by camel-ai → OASIS.
    # Without this pin the override is ignored (uv only applies sources to
    # direct project deps), the GPU wheel wins, and the image balloons
    # by ~6 GB of CUDA runtimes.
    "torch>=2.4.0",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ──────────────────────────────────────────────────────────────────────────────
# CPU-only PyTorch wheels
#
# torch arrives transitively via camel-ai → OASIS, and by default uv pulls the
# CUDA-enabled wheel plus ~4.3 GB of nvidia-* runtimes. OASIS / camel-ai use
# torch only for tensor math on the Python side — no CUDA kernels are invoked
# when LLM calls go out to an OpenAI-compatible endpoint. Forcing torch (and
# its CUDA-bearing cousins) to resolve against PyPI's CPU index drops the
# image size by ~6 GB without affecting any code path MiroFish actually runs.
#
# Override with a build-time index-url if GPU is ever needed.
# ──────────────────────────────────────────────────────────────────────────────
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
